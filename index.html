<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lands in Brazil</title>
    <script src="https://www.google.com" async defer></script>
    <style>
        /* 1. RESET Y BASE */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
           font-family: 'Segoe UI', sans-serif; 
            background-color: #f8f9fa; 
            display: flex; 
            justify-content: center; 
            padding: 40px 20px; 
        }

        /* 2. CONTENEDOR PRINCIPAL (LANDING) */
        .wrapper {
            width: 100%;
            max-width: 650px; /* Limita el ancho para que no se estire */
            background: white;
            border-radius: 20px;
            overflow: hidden;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05); 
        }

        /* 3. BLOQUES DE TEXTO */
        .seccion-texto { 
            margin-bottom: 30px; 
            text-align: center; 
            line-height: 1.6; 
            color: #444; 
        }
        .seccion-texto h1 { color: #222; margin-bottom: 15px; }
        .seccion-texto p { font-size: 17px; color: #666; }

        /* 4. GALERÍA DE 3 FOTOS (GRID) */
        .galeria { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* 3 columnas iguales */
            gap: 15px; 
            margin-bottom: 30px; 
        }
        .galeria img { 
            width: 100%; 
            height: 180px; 
            object-fit: cover; 
            border-radius: 12px; 
            transition: transform 0.3s;
        }
        .galeria img:hover { transform: scale(1.03); }

        /* 5. FORMULARIO */
        .form-card { 
            background: #ffffff; 
            padding: 25px; 
            border: 1px solid #eee; 
            border-radius: 15px; 
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            font-size: 16px; 
            background: #fdfdfd;
        }
        textarea { height: 120px; resize: none; }

        /* 6. CAPTCHA Y BOTÓN */
        .g-recaptcha { margin: 20px 0; display: flex; justify-content: center; }
        .btn-enviar { 
            width: 100%; 
            padding: 16px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.3s;
        }
        .btn-enviar:hover { background-color: #0056b3; }

        /* 7. INSTAGRAM */
        .insta-link { 
            display: block; 
            text-align: center; 
            margin-top: 30px; 
            color: #e1306c; 
            text-decoration: none; 
            font-weight: bold; 
        }

        /* RESPONSIVO */
        @media (max-width: 550px) {
            .galeria { grid-template-columns: 1fr; } /* 1 foto por fila en celular */
            .galeria img { height: 250px; }
            .wrapper { padding: 25px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    
    <!-- 1. TEXTO SUPERIOR -->
    <div class="seccion-texto">
        <h1>Welcome</h1>
        <p>Explore our recent work and discover how we can help you bring your project to life in Brazil.</p>
    </div>

    <!-- 2. GALERÍA DE 3 FOTOS -->
    <div class="galeria">
        <img src="./web/img/Localizaciongeneral.webp" alt="Foto 1">
        <img src="./web/img/Mapaemplazamiento.webp" alt="Foto 2">
        <img src="./web/img/Perimetro.webp" alt="Foto 3">
    </div>

    <!-- 3. TEXTO INTERMEDIO -->
    <div class="seccion-texto">
        <p>Did you like what you saw? We're ready to hear from you. Fill out the form below and we'll get in touch.</p>
    </div>
    <div class="content">
        <h1>Contact Us</h1>
		<p><br></p>
        <p>Leave us your details and we will contact you.</p>
		<p><br></p>
        <form id="form-consulta">
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="nombre" placeholder="Full Name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label>Inquiry</label>
                <textarea name="mensaje" placeholder="¿What do you want to know?" required></textarea>
            </div>

            <!-- CAPTCHA (Recuerda que dará error hasta que tengas dominio) -->
            <div class="g-recaptcha" data-sitekey="TU_CLAVE_SITIO_AQUI"></div>

            <button type="submit" class="btn-enviar" id="btn">Send Message</button>
        </form>

        <a href="https://www.instagram.com/landsinbrazil?igsh=dzEzb3FqYTYycXQ3" target="_blank" rel="noopener noreferrer" class="insta-link">
            Follow us on Instagram
        </a>
    </div>
</div>

<script>
    // Lógica para enviar a Google Sheets
    const form = document.getElementById('form-consulta');
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwzW33eBiFM-QhlkL1CUscNU2EquLjhLDPPCiCbagxqjHaoQj5kLKfkJ46nV2aqkvbw/exec';

    form.addEventListener('submit', e => {
        e.preventDefault();
        /*
        // Validación básica de Captcha
        if (grecaptcha.getResponse().length === 0) {
            alert("Please confirm that you are not a robot");
            return;
        }
		*/
		const formData = new FormData(form);
    
		// Capturar datos del navegador
		formData.append('navegador', navigator.userAgent);
		formData.append('idioma', navigator.language);
		formData.append('resolucion', screen.width + 'x' + screen.height);

        const btn = document.getElementById('btn');
        btn.innerText = "Sending...";
        btn.disabled = true;

        fetch(scriptURL, { method: 'POST',  mode: 'no-cors', body: formData})
            .then(res => {
                alert("Message sent!");
                form.reset();
               /* grecaptcha.reset(); */
                btn.innerText = "Send Message";
                btn.disabled = false;
            })
            .catch(err => alert("Error sending: " + err.message));
    });
</script>

</body>
</html>
